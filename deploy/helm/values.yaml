# Default values for bws-vault-bridge Helm chart.

replicaCount: 2

image:
  repository: ghcr.io/your-org/bws-vault-bridge
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

service:
  type: ClusterIP
  port: 3000

# Pod resource limits (per supplementary_specification.md §3 Performance)
resources:
  limits:
    memory: "256Mi"
    cpu: "500m"
  requests:
    memory: "128Mi"
    cpu: "100m"

# Environment variables
env:
  PORT: "3000"
  BWS_STATE_FILE: "/tmp/bws_state.json"
  CACHE_TTL: "60"
  CACHE_MAX_ENTRIES: "1000"
  LOG_LEVEL: "info"
  CIRCUIT_BREAKER_THRESHOLD: "5"
  CIRCUIT_BREAKER_COOLDOWN: "30"
  # Set only to the addresses/CIDRs of reverse proxies that connect directly
  # to this service; leave empty for direct container access.
  TRUSTED_PROXY_CIDRS: ""
  REAUTH_RETRY_MAX_ATTEMPTS: "5"
  REAUTH_RETRY_BASE_MS: "1000"
  REQUEST_TIMEOUT_MS: "30000"
  HEADERS_TIMEOUT_MS: "10000"
  KEEP_ALIVE_TIMEOUT_MS: "5000"

# Secret reference for BWS_ACCESS_TOKEN (must exist in the namespace)
existingSecret:
  name: "bws-vault-bridge-secret"
  key: "BWS_ACCESS_TOKEN"

# Probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health?deep=true
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 2

# Network policy
networkPolicy:
  enabled: true
  # Only allow ingress from the APISix namespace
  allowedNamespaces:
    - apisix

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Node selector, tolerations, affinity
nodeSelector: {}
tolerations: []
affinity: {}
